version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todopass
      POSTGRES_DB: todos_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ../apps/backend
    environment:
      DATABASE_URL: postgres://todo:todopass@db:5432/todos_dev
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    build: ../apps/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
